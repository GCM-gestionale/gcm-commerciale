name: Verifica pagina commerciale GCM
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/check-release-page.cjs'
      - '.github/workflows/test-landing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlla informazioni versioni e link della pagina
        run: node scripts/check-release-page.cjs
