name: Verifica pagina commerciale GCM
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/check-release-page.cjs'
      - 'scripts/audit-live-site.cjs'
      - '.github/workflows/test-landing.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Controlla informazioni versioni e link della pagina
        run: node scripts/check-release-page.cjs
      - name: Verifica in sola lettura che il sito commerciale sia online
        run: node scripts/audit-live-site.cjs
      - name: Conserva esito controllo sito pubblico
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GCM-commercial-site-readonly-check
          path: gcm-commercial-live-check.json
          retention-days: 7
